<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>State Admin Login — Power Systems Monitor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-login">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Power Systems Monitor</a>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="narrow">
    <div class="login-card">
      <div class="login-icon">🏛️</div>
      <h2>State EB Admin Login</h2>
      
      <form id="loginForm" class="mt-lg">
        <div class="field">
          <label for="adminId">Admin ID</label>
          <input id="adminId" type="text" placeholder="••••••••" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="adminPass">Password</label>
          <input id="adminPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (Session.getAdminToken()) window.location.href = 'state-dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const username = document.getElementById('adminId').value.trim();
        const password = document.getElementById('adminPass').value;
        const { token, admin } = await Api.adminLogin(username, password);
        Session.setAdmin(token, admin);
        window.location.href = 'state-dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>

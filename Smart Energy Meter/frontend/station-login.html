<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EB Station Login — Power Systems Monitor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-login">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Power Systems Monitor</a>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="narrow">
    <div class="login-card">
      <div class="login-icon">⚡</div>
      <h2>EB Station Login</h2>

      <form id="loginForm" class="mt-lg">
        <div class="field">
          <label for="stationId">Station ID</label>
          <input id="stationId" type="text" placeholder="EB001" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (Session.getStationToken()) window.location.href = 'station-dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const stationId = document.getElementById('stationId').value.trim();
        const password = document.getElementById('password').value;
        const { token, station } = await Api.stationLogin(stationId, password);
        Session.setStation(token, station);
        window.location.href = 'station-dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Consumption Predictor — Power Systems Monitor</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .slab-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
  .slab-tile { background: var(--panel-alt); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 0.85rem; }
  .slab-tile h4 { margin: 0 0 0.4rem; font-size: 0.85rem; color: var(--copper-soft); }
  .slab-tile p { margin: 0.15rem 0; font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); }
  #chart { width: 100%; height: 180px; display: block; }
</style>
</head>
<body class="bg-calc">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="dot"></span> Power Systems Monitor</a>
    <nav><a href="index.html">Home</a></nav>
  </header>

  <main class="page-shell" style="max-width:760px;">
    <div class="eyebrow">Consumption Predictor</div>
    <h1 style="font-size:1.5rem;">📊 Unit Consumption Predictor</h1>

    <div class="panel mt-lg" id="entrySection">
      <div class="field">
        <label for="meterId">Meter ID</label>
        <input id="meterId" placeholder="e.g. AR1002" autocomplete="off">
      </div>
      <button class="btn btn-primary btn-block" id="analyzeBtn">Analyze consumption</button>
      <p class="error-msg" id="entryError"></p>
    </div>

    <div class="panel mt-lg hidden" id="resultSection">
      <button class="btn btn-ghost btn-sm" id="backBtn">&larr; Back</button>
      <div id="customerDetails" class="mt-lg"></div>
      <canvas id="chart" class="mt-lg"></canvas>
      <h3 class="mt-lg">Slab Breakdown</h3>
      <div class="slab-grid" id="breakdown"></div>
      <h3 class="mt-lg">💡 Tips to Reduce Consumption</h3>
      <ul id="tips" class="dim" style="line-height:1.7;"></ul>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const entrySection = document.getElementById('entrySection');
    const resultSection = document.getElementById('resultSection');
    const errorEl = document.getElementById('entryError');
    const analyzeBtn = document.getElementById('analyzeBtn');

    async function analyze() {
      errorEl.classList.remove('show');
      const meterId = document.getElementById('meterId').value.trim();
      if (!meterId) {
        errorEl.textContent = 'Please enter a meter ID';
        errorEl.classList.add('show');
        return;
      }
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing…';
      try {
        const data = await Api.analyzeConsumption(meterId);
        renderResult(data);
        entrySection.classList.add('hidden');
        resultSection.classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyze consumption';
      }
    }
    analyzeBtn.addEventListener('click', analyze);
    document.getElementById('meterId').addEventListener('keydown', (e) => { if (e.key === 'Enter') analyze(); });
    document.getElementById('backBtn').addEventListener('click', () => {
      resultSection.classList.add('hidden');
      entrySection.classList.remove('hidden');
      document.getElementById('meterId').value = '';
    });

    function renderResult(data) {
      const c = data.customer;
      document.getElementById('customerDetails').innerHTML = `
        <h3 style="color:var(--copper-soft);">${escapeHtml(c.name || 'Customer')}</h3>
        <p class="dim mono" style="font-size:0.85rem;">Meter: ${escapeHtml(c.meterId)} · Mobile: ${escapeHtml(c.mobile) || '—'} · ${c.phase === '3-phase' ? '3-Phase' : '1-Phase'}</p>
        <p class="dim" style="font-size:0.85rem;">${escapeHtml(c.address) || '—'}${c.state ? ', ' + escapeHtml(c.state) : ''}</p>
        <p class="mono" style="font-size:1.3rem; font-weight:600; margin:1rem 0; color:${data.totalUnits > 300 ? 'var(--danger)' : 'var(--ok)'};">
          ${data.totalUnits} kWh this month · ${formatCurrency(data.amount)}
        </p>
        <p class="dim mono" style="font-size:0.82rem;">Avg daily: ${data.avgDaily} units · Peak days: ${data.peakDays}</p>
      `;

      drawChart(data.dailyData, data.avgDaily);

      document.getElementById('breakdown').innerHTML = data.slabs
        .filter((s) => s.units > 0)
        .map((s) => `
          <div class="slab-tile">
            <h4>${escapeHtml(s.label)}</h4>
            <p>Units: ${s.units}</p>
            <p>Rate: ₹${s.rate}/unit</p>
            <p>Cost: ${formatCurrency(s.cost)}</p>
          </div>
        `).join('');

      document.getElementById('tips').innerHTML = data.tips.map((t) => `<li>${escapeHtml(t)}</li>`).join('');
    }

    function drawChart(daily, avg) {
      const canvas = document.getElementById('chart');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 180 * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const w = rect.width, h = 180;
      ctx.clearRect(0, 0, w, h);

      const max = Math.max(...daily, avg, 1);
      const barW = w / daily.length;

      // average line
      const avgY = h - 20 - (avg / max) * (h - 40);
      ctx.strokeStyle = 'rgba(226,147,46,0.6)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, avgY);
      ctx.lineTo(w, avgY);
      ctx.stroke();
      ctx.setLineDash([]);

      daily.forEach((v, i) => {
        const barH = (v / max) * (h - 40);
        const x = i * barW + 1;
        const y = h - 20 - barH;
        ctx.fillStyle = v > avg * 1.1 ? '#f0645c' : '#55b6e8';
        ctx.fillRect(x, y, Math.max(barW - 2, 1), barH);
      });

      ctx.fillStyle = '#6d7c92';
      ctx.font = '10px monospace';
      ctx.fillText('Day 1', 2, h - 4);
      ctx.fillText('Day 30', w - 42, h - 4);
      ctx.fillText(`avg ${avg}`, 4, avgY - 4);
    }
  </script>
</body>
</html>
